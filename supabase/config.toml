
[functions.whoop-auth]
enabled = true
verify_jwt = true
import_map = "./functions/whoop-auth/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/whoop-auth/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/whoop-auth/*.html" ]

[functions.parse-meal-photo]
enabled = true
# verify_jwt: la PWA llama con la sesion de Supabase del usuario. La funcion genera una
# URL firmada con la service role (que ignora el RLS del bucket), asi que necesita saber
# quien pregunta para comprobar que la foto es suya.
verify_jwt = true
import_map = "./functions/parse-meal-photo/deno.json"
entrypoint = "./functions/parse-meal-photo/index.ts"

[functions.steps-ingest]
enabled = true
# verify_jwt = false: la llama un Atajo de iOS, que no tiene sesion de Supabase. La auth es un
# secreto compartido (STEPS_INGEST_SECRET) comprobado dentro de la funcion, y el usuario es fijo
# (STEPS_USER_ID). Sin esto el Atajo tendria que llevar un JWT que caduca.
verify_jwt = false
entrypoint = "./functions/steps-ingest/index.ts"

[functions.strava-sync]
enabled = true
# verify_jwt: la PWA llama con la sesion del usuario y la funcion escribe sus carreras.
verify_jwt = true
entrypoint = "./functions/strava-sync/index.ts"

[functions.integrations-oauth]
enabled = true
# verify_jwt: esta funcion crea la fila `oauth_states` que autenticara despues al callback, asi
# que necesita saber de quien es la integracion. Es el unico punto autenticado del flujo.
verify_jwt = true
import_map = "./functions/integrations-oauth/deno.json"
entrypoint = "./functions/integrations-oauth/index.ts"

[functions.integrations-callback]
enabled = true
# verify_jwt = false A PROPOSITO: aqui llega el navegador del PROVEEDOR (WHOOP o Withings) tras
# el consentimiento, sin JWT — en el iPhone la redireccion abre Safari, donde la PWA instalada
# no tiene sesion. La auth es la fila `oauth_states`: la creo un `authorize` autenticado, lleva
# el user_id, es de un solo uso (se borra en la misma sentencia que la lee) y caduca en 10 min.
verify_jwt = false
import_map = "./functions/integrations-callback/deno.json"
entrypoint = "./functions/integrations-callback/index.ts"

[functions.whoop-sync]
enabled = true
# verify_jwt = true en los DOS modos. Con la sesion de la PWA el usuario sale del JWT; el cron
# de pg_net manda el JWT anon (que satisface esta puerta, es publico) MAS la cabecera
# `x-cron-secret`, que es el secreto de verdad y se compara en tiempo constante dentro.
verify_jwt = true
import_map = "./functions/whoop-sync/deno.json"
entrypoint = "./functions/whoop-sync/index.ts"

[functions.whoop-webhook]
enabled = true
# verify_jwt = false: quien llama es WHOOP, que no tiene JWT. La auth es la FIRMA HMAC-SHA256
# del cuerpo crudo con nuestro WHOOP_CLIENT_SECRET (base64, sobre
# `X-WHOOP-Signature-Timestamp` + cuerpo), con ventana de 5 minutos y comparacion en tiempo
# constante. Un verify_jwt = true aqui haria que el gateway rechazara todos los eventos.
verify_jwt = false
import_map = "./functions/whoop-webhook/deno.json"
entrypoint = "./functions/whoop-webhook/index.ts"

[functions.withings-sync]
enabled = true
# verify_jwt: mismos dos modos que whoop-sync (sesion de la PWA, o JWT anon + `x-cron-secret`).
verify_jwt = true
import_map = "./functions/withings-sync/deno.json"
entrypoint = "./functions/withings-sync/index.ts"

[functions.withings-webhook]
enabled = true
# verify_jwt = false: llama Withings, sin JWT. Y Withings NO FIRMA sus notificaciones, asi que
# la auth es doble: (1) la propia URL lleva `?t=<WITHINGS_WEBHOOK_TOKEN>`, comparado en tiempo
# constante, y (2) el `userid` del cuerpo tiene que existir como `external_user_id` en
# `integration_tokens`. HEAD/GET responden 200 porque Withings comprueba la URL asi antes de
# aceptar la suscripcion.
verify_jwt = false
import_map = "./functions/withings-webhook/deno.json"
entrypoint = "./functions/withings-webhook/index.ts"

[functions.coach-weekly-review]
enabled = true
# verify_jwt: la PWA llama con la sesion de Supabase del usuario. La funcion escribe filas de
# `coach_reviews` con la service role (que ignora el RLS), asi que necesita saber de quien es
# la revision antes de escribirla. Sin esto cualquiera podria gastar $0,60 en la cuenta ajena.
verify_jwt = true
import_map = "./functions/coach-weekly-review/deno.json"
entrypoint = "./functions/coach-weekly-review/index.ts"
# rules-compact.json NO va en static_files: se importa con `with { type: "json" }`, asi que
# entra en el grafo de modulos y el deploy lo empaqueta solo. En static_files se serviria dos
# veces y la copia servida podria desincronizarse de la importada.
